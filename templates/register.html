<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMS Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background: linear-gradient(135deg,#0d6efd,#6ea8fe); min-height:100vh;">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card shadow-lg p-4 rounded-4" style="width:450px;">

        <div class="text-center">
            <i class="bi bi-person-plus-fill text-primary" style="font-size:60px;"></i>
            <h2 class="mt-2">Create Account</h2>
            <p class="text-muted">Register to UCMS</p>
        </div>

        <form action="/register_user" method="POST">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="mb-3">
                <label>Role</label>
                <select name="role" class="form-select" required>
                    
                    <option value="">Select Role</option>
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Admin</option>
                    <option>Program Head</option>
                    <option>HOD</option>
                    <option>Accounts Coordinator</option>
                    <option value="Committee">Committee</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
                
            

        </form>

    </div>

</div>

</body>
</html>
