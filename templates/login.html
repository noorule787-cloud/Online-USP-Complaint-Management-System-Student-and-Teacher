<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USP Complaint Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        font-family:
            "Segoe UI",
            Arial,
            sans-serif;

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(76, 118, 205, 0.35),
                transparent 27%
            ),

            radial-gradient(
                circle at 88% 78%,
                rgba(255, 255, 255, 0.10),
                transparent 28%
            ),

            radial-gradient(
                circle at 50% 100%,
                rgba(41, 75, 155, 0.28),
                transparent 35%
            ),

            linear-gradient(
                135deg,
                #06183f 0%,
                #0a2865 38%,
                #123e8d 68%,
                #071b48 100%
            );

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 25px 18px;

        overflow-x: hidden;

        position: relative;
    }


    /* ================================
       BACKGROUND DECORATION
    ================================= */

    body::before {
        content: "";

        position: fixed;

        width: 470px;

        height: 470px;

        border-radius: 50%;

        border:
            1px solid
            rgba(255,255,255,0.09);

        top: -270px;

        left: -190px;

        box-shadow:
            0 0 0 38px rgba(255,255,255,0.025),
            0 0 0 75px rgba(255,255,255,0.015);

        pointer-events: none;
    }


    body::after {
        content: "";

        position: fixed;

        width: 450px;

        height: 450px;

        border-radius: 50%;

        border:
            1px solid
            rgba(255,255,255,0.08);

        right: -230px;

        bottom: -250px;

        box-shadow:
            0 0 0 38px rgba(255,255,255,0.025),
            0 0 0 75px rgba(255,255,255,0.015);

        pointer-events: none;
    }


    .background-dots {
        position: fixed;

        width: 75px;

        height: 75px;

        opacity: 0.30;

        background-image:
            radial-gradient(
                rgba(255,255,255,0.85) 1.4px,
                transparent 1.4px
            );

        background-size: 14px 14px;

        pointer-events: none;
    }


    .dots-top {
        top: 28px;
        right: 45px;
    }


    .dots-bottom {
        bottom: 25px;
        left: 35px;
    }


    /* ================================
       MAIN WRAPPER
    ================================= */

    .login-wrapper {
        width: 100%;

        max-width: 560px;

        position: relative;

        z-index: 5;
    }


    /* ================================
       PORTAL HEADING
    ================================= */

    .portal-heading {
        text-align: center;

        color: white;

        margin-bottom: 17px;

        animation:
            headingAppear 0.8s ease;
    }


    @keyframes headingAppear {

        from {
            opacity: 0;

            transform:
                translateY(-12px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }
    }


    .portal-logo {
        width: 58px;

        height: 58px;

        margin:
            0 auto 10px;

        border-radius: 17px;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            rgba(255,255,255,0.12);

        border:
            1px solid
            rgba(255,255,255,0.25);

        box-shadow:
            0 10px 25px
            rgba(0,0,0,0.18);

        backdrop-filter:
            blur(10px);

        font-size: 26px;

        color: white;
    }


    .portal-heading h1 {
        margin: 0;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 31px;

        font-weight: 700;

        line-height: 1.12;

        letter-spacing:
            -0.3px;

        text-shadow:
            0 3px 14px
            rgba(0,0,0,0.20);
    }


    .portal-heading h1 span {
        color: #ff7474;
    }


    .portal-subtitle {
        margin-top: 7px;

        color:
            rgba(255,255,255,0.78);

        font-size: 10px;

        font-weight: 600;

        letter-spacing: 3.2px;

        text-transform:
            uppercase;
    }


    .heading-line {
        width: 90px;

        height: 3px;

        margin:
            11px auto 0;

        border-radius: 10px;

        background:
            linear-gradient(
                90deg,
                transparent,
                #ff6565,
                transparent
            );
    }


    /* ================================
       LOGIN CARD
    ================================= */

    .login-card {
        background:
            rgba(255,255,255,0.97);

        border:
            1px solid
            rgba(255,255,255,0.98);

        border-radius: 27px;

        padding:
            25px 35px 21px;

        box-shadow:
            0 30px 65px
            rgba(0,0,0,0.30),

            0 8px 25px
            rgba(0,0,0,0.12);

        position: relative;

        overflow: hidden;

        animation:
            cardAppear 0.8s ease;
    }


    .login-card::before {
        content: "";

        position: absolute;

        top: 0;

        left: 50%;

        transform:
            translateX(-50%);

        width: 125px;

        height: 4px;

        border-radius:
            0 0 10px 10px;

        background:
            linear-gradient(
                90deg,
                #153f91,
                #ff6262
            );
    }


    @keyframes cardAppear {

        from {
            opacity: 0;

            transform:
                translateY(20px)
                scale(0.98);
        }

        to {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }


    /* ================================
       WELCOME SECTION
    ================================= */

    .welcome-icon {
        width: 59px;

        height: 59px;

        margin:
            1px auto 9px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #123c8d,
                #285ab1
            );

        color: white;

        font-size: 24px;

        box-shadow:
            0 9px 20px
            rgba(18,60,141,0.25);

        border:
            4px solid
            #edf3ff;
    }


    .welcome-title {
        text-align: center;

        color:
            #102d67;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size: 24px;

        font-weight: 700;

        margin-bottom: 4px;
    }


    .welcome-text {
        text-align: center;

        color:
            #75809a;

        font-size: 13px;

        margin-bottom: 19px;
    }


    /* ================================
       FORM LABEL
    ================================= */

    .form-label {
        font-weight: 700;

        color:
            #18376f;

        margin-bottom: 6px;

        font-size: 13px;
    }


    /* ================================
       INPUTS
    ================================= */

    .input-group {
        margin-bottom: 14px;

        border-radius: 12px;

        overflow: hidden;

        box-shadow:
            0 3px 10px
            rgba(19,54,115,0.04);
    }


    .input-group-text {
        min-width: 49px;

        justify-content: center;

        background:
            #edf3fc;

        border:
            1px solid
            #d5e0f0;

        border-right: none;

        color:
            #174496;

        font-size: 15px;
    }


    .form-control {
        height: 47px;

        border:
            1px solid
            #d5e0f0;

        border-left: none;

        background:
            #f9fbff;

        box-shadow:
            none !important;

        font-size: 13px;

        color:
            #24385e;
    }


    .form-control::placeholder {
        color:
            #9ba8bd;
    }


    .form-control:focus {
        background: white;

        border-color:
            #315eb2;

        box-shadow:
            none !important;
    }


    .input-group:focus-within
    .input-group-text {
        border-color:
            #315eb2;

        color:
            #153f91;

        background:
            #eef4ff;
    }


    /* ================================
       LOGIN BUTTON
    ================================= */

    .login-btn {
        height: 49px;

        border: none;

        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                #0b2e73,
                #17499d,
                #285db5
            );

        color: white;

        font-size: 15px;

        font-weight: 700;

        letter-spacing:
            0.2px;

        box-shadow:
            0 10px 21px
            rgba(17,65,145,0.27);

        transition:
            all 0.25s ease;
    }


    .login-btn:hover {
        transform:
            translateY(-2px);

        background:
            linear-gradient(
                135deg,
                #09265f,
                #123f8b,
                #2252a5
            );

        box-shadow:
            0 14px 27px
            rgba(17,65,145,0.34);

        color: white;
    }


    .login-btn:active {
        transform:
            translateY(0);
    }


    /* ================================
       REGISTER
    ================================= */

    .register-text {
        text-align: center;

        margin-top: 15px;

        color:
            #7c879b;

        font-size: 13px;
    }


    .register-link {
        color:
            #e04f58;

        font-weight: 700;

        text-decoration: none;

        transition:
            color 0.2s ease;
    }


    .register-link:hover {
        color:
            #153f91;

        text-decoration:
            underline;
    }


    /* ================================
       SECURITY
    ================================= */

    .security-note {
        display: flex;

        align-items: center;

        justify-content: center;

        gap: 6px;

        margin-top: 10px;

        color:
            #929caf;

        font-size: 10px;
    }


    .security-note i {
        color:
            #285ab1;
    }


    /* ================================
       FOOTER
    ================================= */

    .footer-text {
        text-align: center;

        margin-top: 11px;

        padding-top: 10px;

        border-top:
            1px solid
            #e7ebf2;

        color:
            #8993a5;

        font-size: 10px;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

        body {
            padding:
                20px 13px;

            overflow-y: auto;
        }


        .login-wrapper {
            max-width:
                490px;
        }


        .portal-heading h1 {
            font-size:
                26px;
        }


        .portal-subtitle {
            font-size:
                8px;

            letter-spacing:
                2.2px;
        }


        .portal-logo {
            width: 53px;

            height: 53px;

            font-size: 23px;
        }


        .login-card {
            padding:
                25px 21px 20px;

            border-radius:
                23px;
        }


        .welcome-icon {
            width: 56px;

            height: 56px;

            font-size: 23px;
        }


        .welcome-title {
            font-size:
                22px;
        }


        .welcome-text {
            font-size:
                12px;

            margin-bottom:
                17px;
        }


        .dots-top,
        .dots-bottom {
            display: none;
        }
    }


    @media (max-width: 380px) {

        .portal-heading h1 {
            font-size:
                23px;
        }


        .login-card {
            padding:
                23px 17px 18px;
        }
    }

</style>

</head>


<body>


<!-- Background decoration -->

<div class="background-dots dots-top"></div>

<div class="background-dots dots-bottom"></div>


<div class="login-wrapper">


    <!-- Portal Heading -->

    <div class="portal-heading">


        <div class="portal-logo">

            <i class="bi bi-mortarboard-fill"></i>

        </div>


        <h1>

            USP Complaint
            <br>

            Management System
            <span>Portal</span>

        </h1>


        <div class="portal-subtitle">

            University Complaint Management Portal

        </div>


        <div class="heading-line"></div>


    </div>



    <!-- LOGIN CARD -->

    <div class="login-card">


        <!-- Welcome Icon -->

        <div class="welcome-icon">

            <i class="bi bi-person-check-fill"></i>

        </div>


        <div class="welcome-title">

            Welcome Back

        </div>


        <div class="welcome-text">

            Please login to continue to your account.

        </div>



        <!-- LOGIN FORM -->

        <form
            action="/login_user"
            method="POST"
        >


            <!-- Email -->

            <label class="form-label">

                Email Address

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-envelope-fill"></i>

                </span>


                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your university email"
                    required
                >

            </div>



            <!-- Password -->

            <label class="form-label">

                Password

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>


                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- Login -->

            <button
                type="submit"
                class="btn login-btn w-100"
            >

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login to Portal

            </button>


        </form>



        <!-- Register -->

        <div class="register-text">

            Don't have an account?

            <a
                href="/register"
                class="register-link"
            >

                Register Here

            </a>

        </div>



        <!-- Security -->

        <div class="security-note">

            <i class="bi bi-shield-check"></i>

            Secure university portal access

        </div>



        <!-- Footer -->

        <div class="footer-text">

            University of Southern Punjab
            •
            Complaint Management Portal

        </div>


    </div>


</div>


</body>

</html>
